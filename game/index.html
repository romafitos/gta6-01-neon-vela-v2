<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Vela</title>
<meta name="description" content="Neon Vela: a 3D open-world crime game in Vela City, a golden-hour coastal city — 10 story missions, 6 weapons with a weapon wheel, 5-star police dispatch with roadblocks, RAM/PIT units and the Kestrel 7 searchlight helicopter, a 3-member crew with a shock-grenade/EMP ability, 4 districts with turf control and respect ranks, 3 street races, 3 drive-in garages, a 3-station synthesized radio and autosave. Runs fully offline.">
<!--
  Neon Vela — every feature below is driven by a headless browser test in tools/audit.mjs
  * Vela City: 4 districts (Palma Heights, Neon Mile, Old Harbor, Vela Beach), traffic, pedestrians, beach, neon towers
  * 10 story missions: Sunset Pickup, Neon Till, Harbor Rat, Quiet Wheels, Dockside Turf, Hot Cargo,
    Armored Tide, The Pier Contract, Bonfire Standoff, King of the Coast (minimap marker + GPS route)
  * 6 weapons + Q/Tab weapon wheel; cars smoke, burn and explode into burning wrecks
  * 5-star dispatch: foot cops, chasing cruisers, RAM and PIT units, roadblocks, Kestrel 7 helicopter searchlight
  * crew of 3 (C to hire/call, they ride along and shoot), G shock grenade + EMP; turf control and respect ranks
  * 3 street races (Sundown Sprint, Neon Loop, Harbor Rush) vs AI racers; 3 garages: repair, respray, engine/handling/armour
  * Web Audio radio: SUNSET DRIVE 88.1, PALM TAPE FM 93.4, RADIO CALOR 101.7; synthesized SFX; versioned autosave
-->
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Neon Vela: an open-world crime game in a golden-hour coastal city"></canvas>

<div id="hud" class="hidden">
  <div id="hud-top-left">
    <div class="bar-row"><span class="bar-label">HP</span><div class="bar"><div id="hp-fill" class="bar-fill hp"></div></div></div>
    <div class="bar-row"><span class="bar-label">AR</span><div class="bar"><div id="ar-fill" class="bar-fill ar"></div></div></div>
    <div id="cash">$0</div>
  </div>
  <div id="hud-top-right">
    <div id="stars" aria-label="Wanted level"></div>
    <div id="vehicle-info"></div>
    <div id="weapon-info"></div>
    <div id="station" class="hidden" aria-live="polite"></div>
  </div>
  <div id="radio" aria-live="polite"></div>
  <div id="damage-flash"></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="objective"></div>
  <div id="minimap-wrap"><canvas id="minimap" width="200" height="200"></canvas><div id="district-name"></div></div>
  <div id="prompt"></div>
  <div id="help" class="panel"></div>
  <div id="crosshair">+</div>
</div>

<div id="wheel" class="hidden" aria-label="Weapon wheel"></div>
<div id="death-card" class="hidden"></div>

<div id="title" class="overlay">
  <div class="title-card">
    <h1 class="logo">NEON<span>VELA</span></h1>
    <p class="tagline">The coast is gold. The streets are yours.</p>
    <button id="continue-btn" type="button" class="hidden">CONTINUE</button>
    <button id="play-btn" type="button">PLAY</button>
    <p class="hint">Click Play &mdash; you start on the street, ready to go.</p>
    <p id="save-note" class="hint save-note hidden"></p>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="title-card small">
    <h2>PAUSED</h2>
    <button id="resume-btn" type="button">RESUME</button>
    <div id="pause-help"></div>
  </div>
</div>

<p id="status" class="sr-only" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
